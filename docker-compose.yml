services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pelita
      POSTGRES_USER: pelita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pelita_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pelita-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelita -d pelita"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pelita-db:
